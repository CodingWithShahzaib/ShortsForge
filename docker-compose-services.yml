services:
  postgres:
    image: postgres:16
    container_name: shortsforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shortsforge
      POSTGRES_USER: shortsforge
      POSTGRES_PASSWORD: shortsforge_password
    ports:
      - "5432:5432"
    volumes:
      - azanxstudio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortsforge -d shortsforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: shortsforge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - azanxstudio_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: shortsforge_minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - azanxstudio_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: shortsforge_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/shortsforge ||
      true
      "

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    container_name: shortsforge_kokoro_tts
    restart: unless-stopped
    ports:
      - "8880:8880"
    # Use NVIDIA GPU: requires NVIDIA drivers + NVIDIA Container Toolkit on the host.
    # This exposes all GPUs to the container (adjust as needed).
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  azanxstudio_postgres_data:
  azanxstudio_redis_data:
  azanxstudio_minio_data: